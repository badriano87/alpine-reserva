<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Alpine Reserva — Registrar limpeza</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="topo">
  <div>
    <h1 id="tituloTopo">Registrar limpeza</h1>
    <div class="subtitulo" id="subtituloTopo">Escolha a cabana</div>
  </div>
  <a class="link-topo" href="index.html">Sair</a>
</header>

<main>

  <div id="areaCarregando" class="aviso-carregando">Carregando produtos...</div>
  <div id="areaErro"></div>

  <div id="areaCabanas" class="cartao" style="display:none;">
    <h2>Qual cabana você está limpando?</h2>
    <div class="grade-cabanas" id="gradeCabanas"></div>
  </div>

  <div id="areaData" class="cartao" style="display:none;">
    <h2>Qual o dia de hoje?</h2>
    <label for="campoData">Data</label>
    <input type="date" id="campoData" />
    <br /><br />
    <button class="botao botao-primario" id="botaoConfirmarData">Continuar</button>
  </div>

  <div id="areaChecklist" style="display:none;">
    <div class="bloco-titulo">Produtos de limpeza que vou usar</div>
    <div id="blocoLimpeza"></div>

    <div class="bloco-titulo">Itens de Reposição</div>
    <div id="blocoReposicao"></div>

    <div class="bloco-titulo">Estado de Conservação</div>
    <div id="blocoConservacao"></div>

    <div class="bloco-titulo">Nota que dou a este hóspede</div>
    <div id="blocoNota"></div>
  </div>

  <div id="areaConfirmacao" class="tela-confirmacao" style="display:none;">
    <div class="icone">✅</div>
    <h2>Limpeza registrada com sucesso!</h2>
    <p id="resumoConfirmacao"></p>
    <br />
    <button class="botao botao-primario" id="botaoNovaLimpeza">Registrar outra limpeza</button>
  </div>

</main>

<div class="barra-salvar" id="barraSalvar" style="display:none;">
  <button class="botao botao-primario" id="botaoSalvar">💾 Salvar limpeza</button>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/login.js"></script>
<script src="js/blocos.js"></script>
<script src="js/limpeza.js"></script>

</body>
</html>
